name: Docker (Windows)
run-name: Test docker image on Windows
on:
  workflow_dispatch:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
defaults:
  run:
    shell: bash
jobs:
  build:
    name: 'Build image'
    runs-on: 'windows-latest'
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-node@v4
      - name: Set up Docker
        uses: docker/setup-docker-action@v4
      - name: Enable Docker experimental features
        run: |
          $configPath = "$env:ProgramData\Docker\config\daemon.json"
          New-Item -Path $configPath -Force
          Set-Content -Path $configPath -Value '{ "experimental": true }'
          Restart-Service docker
        shell: pwsh
      - name: Build server docker image
        run: docker build -t lean4monaco -f Dockerfile .
      - name: Start server
        run: docker run -dit -p 5173:5173 -p 8080:8080 lean4monaco
      - name: Run tests (electron)
        uses: cypress-io/github-action@v6
        with:
          browser: electron
          wait-on: 'http://localhost:5173'
